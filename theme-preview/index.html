<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Soft Hours — Ecommerce V2 Review</title>
    <link rel="icon" href="circle.png">
    <link rel="stylesheet" href="review.css">
    <script src="review.js" defer></script>
  </head>
  <body>
    <header class="review-header">
      <div class="review-brand">
        <span class="review-brand__name">SOFT HOURS</span>
        <span class="review-brand__label">Ecommerce V2</span>
      </div>
      <p>Exact Paper artboard exports · 25 screens · Review only</p>
      <a href="https://app.paper.design/file/01KSQJRVQRH3PFPCCTXWKB2R1D/3-1" target="_blank" rel="noreferrer">Open Paper ↗</a>
    </header>

    <div class="review-shell">
      <aside class="screen-nav" aria-label="Ecommerce V2 screens">
        <div class="screen-nav__intro">
          <span>Screen index</span>
          <strong>25</strong>
        </div>

        <nav>
          <section class="nav-group">
            <h2>Core experience</h2>
            <button class="screen-link is-active" data-name="Homepage" data-device="Desktop · 1440px" data-src="paper/homepage.webp">Homepage <span>Desktop</span></button>
            <button class="screen-link" data-name="Collection I" data-device="Desktop · 1440px" data-src="paper/collection-desktop.webp">Collection I <span>Desktop</span></button>
            <button class="screen-link" data-name="Product" data-device="Desktop · 1440px" data-src="paper/product-desktop.webp">Product <span>Desktop</span></button>
            <button class="screen-link" data-name="About" data-device="Desktop · 1440px" data-src="paper/about-desktop.webp">About <span>Desktop</span></button>
            <button class="screen-link" data-name="Collection I" data-device="Mobile · 390px" data-src="paper/collection-mobile.webp">Collection I <span>Mobile</span></button>
            <button class="screen-link" data-name="Product" data-device="Mobile · 390px" data-src="paper/product-mobile.webp">Product <span>Mobile</span></button>
            <button class="screen-link" data-name="About" data-device="Mobile · 390px" data-src="paper/about-mobile.webp">About <span>Mobile</span></button>
          </section>

          <section class="nav-group">
            <h2>Purchase flow</h2>
            <button class="screen-link" data-name="Cart drawer" data-device="Desktop · 1440px" data-src="paper/cart-drawer.webp">Cart drawer <span>Desktop</span></button>
            <button class="screen-link" data-name="Cart page" data-device="Desktop · 1440px" data-src="paper/cart-page.webp">Cart page <span>Desktop</span></button>
            <button class="screen-link" data-name="Cart drawer" data-device="Mobile · 390px" data-src="paper/cart-drawer-mobile.webp">Cart drawer <span>Mobile</span></button>
            <button class="screen-link" data-name="Commerce states" data-device="Desktop · 1440px" data-src="paper/commerce-states.webp">Commerce states <span>System</span></button>
          </section>

          <section class="nav-group">
            <h2>Discovery & account</h2>
            <button class="screen-link" data-name="Search" data-device="Desktop · 1440px" data-src="paper/search-desktop.webp">Search <span>Desktop</span></button>
            <button class="screen-link" data-name="Search" data-device="Mobile · 390px" data-src="paper/search-mobile.webp">Search <span>Mobile</span></button>
            <button class="screen-link" data-name="Account entry" data-device="Desktop · 1440px" data-src="paper/account-desktop.webp">Account entry <span>Desktop</span></button>
            <button class="screen-link" data-name="Account entry" data-device="Mobile · 390px" data-src="paper/account-mobile.webp">Account entry <span>Mobile</span></button>
          </section>

          <section class="nav-group">
            <h2>Journal</h2>
            <button class="screen-link" data-name="Journal" data-device="Desktop · 1440px" data-src="paper/journal-desktop.webp">Journal <span>Desktop</span></button>
            <button class="screen-link" data-name="Journal" data-device="Mobile · 390px" data-src="paper/journal-mobile.webp">Journal <span>Mobile</span></button>
            <button class="screen-link" data-name="Journal article" data-device="Desktop · 1440px" data-src="paper/journal-article-desktop.webp">Journal article <span>Desktop</span></button>
            <button class="screen-link" data-name="Journal article" data-device="Mobile · 390px" data-src="paper/journal-article-mobile.webp">Journal article <span>Mobile</span></button>
          </section>

          <section class="nav-group">
            <h2>Support & utility</h2>
            <button class="screen-link" data-name="Gift card" data-device="Desktop · 1440px" data-src="paper/gift-card-desktop.webp">Gift card <span>Desktop</span></button>
            <button class="screen-link" data-name="Gift card" data-device="Mobile · 390px" data-src="paper/gift-card-mobile.webp">Gift card <span>Mobile</span></button>
            <button class="screen-link" data-name="Size guide" data-device="Desktop · 1440px" data-src="paper/size-guide-desktop.webp">Size guide <span>Desktop</span></button>
            <button class="screen-link" data-name="Size guide" data-device="Mobile · 390px" data-src="paper/size-guide-mobile.webp">Size guide <span>Mobile</span></button>
            <button class="screen-link" data-name="Support & policy" data-device="Desktop · 1440px" data-src="paper/support-desktop.webp">Support & policy <span>Desktop</span></button>
            <button class="screen-link" data-name="Support & policy" data-device="Mobile · 390px" data-src="paper/support-mobile.webp">Support & policy <span>Mobile</span></button>
          </section>
        </nav>
      </aside>

      <main class="viewer" id="viewer">
        <div class="viewer-toolbar">
          <div>
            <p>Soft Hours Ecommerce V2</p>
            <h1 data-screen-name>Homepage</h1>
            <span data-screen-device>Desktop · 1440px</span>
          </div>
          <div class="viewer-actions">
            <button type="button" data-fit-toggle>Fit full screen</button>
            <a data-open-image href="paper/homepage.webp" target="_blank" rel="noreferrer">Open image ↗</a>
          </div>
        </div>
        <div class="viewer-stage" data-viewer-stage aria-live="polite">
          <div class="loading-state" data-loading>Loading Paper export…</div>
          <img class="screen-image" data-screen-image src="paper/homepage.webp" alt="Soft Hours Ecommerce V2 Homepage desktop artboard">
        </div>
      </main>
    </div>
  </body>
</html>
