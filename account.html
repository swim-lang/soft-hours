<body>
  <div class="page account-page-v2">
    <header class="nav">
      <div class="nav-side nav-left"><a href="index.html" class="wordmark-nav" aria-label="Soft Hours"></a></div>
      <nav class="nav-links"></nav><div class="nav-side nav-right"></div>

    <main class="account-page-main">
      <section class="account-intro"><p class="page-eyebrow">Account</p><h1>YOUR SOFT HOURS</h1><p>Sign in to view orders, save your details, and return to the pieces you have chosen.</p></section>
