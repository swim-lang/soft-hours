<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Soft Hours — Gift Card</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v2.css" />
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="nav-side nav-left"><a href="index.html" class="wordmark-nav" aria-label="Soft Hours"></a></div>
      <nav class="nav-links"></nav><div class="nav-side nav-right"></div>
      <button class="nav-burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span></button>
    </header>
    <div class="mobile-menu" id="mobile-menu"></div>
    <main class="utility-v2">
      <div class="utility-v2__inner">
        <header><p class="page-eyebrow">A Soft Hours gift</p><h1>TIME, WELL GIVEN</h1><p>A digital gift card for Collection I. Shopify’s native gift-card delivery will be connected during staging.</p></header>
        <div class="utility-grid">
          <div class="gift-card-visual"><div><strong>SOFT HOURS</strong><span>For the first hour and the last</span><span data-gift-card-preview>EUR 200</span></div></div>
          <form class="utility-form" data-gift-card-form>
            <div><label>Amount</label><div class="amount-options"><button type="button" data-amount="100" aria-pressed="false">EUR 100</button><button type="button" data-amount="200" aria-pressed="true">EUR 200</button><button type="button" data-amount="300" aria-pressed="false">EUR 300</button><button type="button" data-amount="500" aria-pressed="false">EUR 500</button></div></div>
            <div><label for="gift-recipient">Recipient email</label><input id="gift-recipient" type="email" required placeholder="recipient@example.com" /></div>
            <div><label for="gift-message">Message</label><textarea id="gift-message" rows="4" placeholder="A note for the recipient"></textarea></div>
            <button class="prototype-button prototype-button--dark" type="submit">Add Gift Card to Cart</button>
            <p class="prototype-status" data-form-status aria-live="polite"></p>
          </form>
        </div>
      </div>
    </main>
    <footer class="footer"></footer>
  </div>
  <script src="nav.js"></script>
</body>
</html>
